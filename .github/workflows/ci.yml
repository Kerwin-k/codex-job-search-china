name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python regression
        run: python -m unittest discover -s tests -v
      - name: Browser policy and send guards
        run: node --test tests/policy.test.cjs
      - name: Self-contained plugins
        run: python tools/sync_shared.py --check
      - name: Public release boundary
        run: python tools/release_check.py --history
